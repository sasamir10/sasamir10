
name: Generate Breakout SVG

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate-svg:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate custom SVG
        uses: cyprieng/github-breakout@v1
        with:
          github_username: sasamir10
          paddle_color: "#58A6FF"
          ball_color: "#DBEAFE"
          bricks_colors: "#0E2A47,#174A7E,#1F6FEB,#388BFD,#58A6FF"

      - name: Move generated SVG
        run: |
          mkdir -p /tmp/breakout-images
          cp output/custom.svg /tmp/breakout-images/breakout-custom.svg

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and force-push SVG
        run: |
          git checkout --orphan github-breakout
          git rm -rf .

          mkdir images
          cp /tmp/breakout-images/breakout-custom.svg images/

          git add images
          git commit -m "chore: update GitHub breakout SVG"
          git push --force origin github-breakout
