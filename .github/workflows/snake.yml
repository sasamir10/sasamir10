name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate snake animation
  uses: Platane/snk@v3
  with:
    github_user_name: sasamir10

    outputs: |
      dist/github-contribution-grid-snake.svg?color_snake=#00D9FF&color_dots=#0D1117,#0B2A4A,#0D4F8B,#1F6FEB,#58A6FF
      dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00D9FF&color_dots=#0D1117,#0B2A4A,#0D4F8B,#1F6FEB,#58A6FF

      - name: Push snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
